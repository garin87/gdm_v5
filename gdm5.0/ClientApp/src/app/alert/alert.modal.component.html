<div class="csi-dialog-modal"><h3 mat-dialog-title class="dialog-title">{{title}}</h3><div mat-dialog-content><div class="alert">{{messageText}}</div></div><div mat-dialog-actions class="dialog-footer"> 
        <button mat-raised-button color="warn" class="default-btn" (click)="execute('cancel')">{{cancelBtnCaption}}</button>  
        <button mat-raised-button color="primary" class="primary-btn" (click)="execute('primary')">{{primaryBtnCaption}}</button></div>   
</div>
