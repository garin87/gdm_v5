<div  class="app-form-field-row" id="{{metadataTypeName + 'controls-id'}}" *ngIf="properties | async" >
     <div *ngFor="let property of(properties) | async" class="row-property">
       <field-editor  class="app-property-row" [property]="property" 
            [valueUpdated]="valueUpdated" 
            [listCreatedField]="this._formEditorService.listCreatedField" >
        </field-editor>
     </div>
</div>
