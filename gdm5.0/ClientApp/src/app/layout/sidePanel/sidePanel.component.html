
<mat-drawer-container class="app-sidenav-container" autosize>
  <mat-drawer #drawer class="sidenav-content-container" mode="side" >
    <div class="filter-sidenav-content">
      <mat-form-field class="filter-sidenav-content-field" appearance="fill">
        <!-- <mat-label>Filter product</mat-label> -->
        <div class="sidenav-filterControl-container">
        <input type="text" [formControl]="filterControl"
               placeholder="{{this._labelsService.labels.sidePanel_Search}}"
               matInput  #filterContent>
               <mat-icon>search</mat-icon>
              </div>
      </mat-form-field>
    </div>
    <div class="sidenav-list-properties" *ngIf="listProps">
      <div *ngFor="let element of listProps | async" class="panel-property-row">
        <div class="data-property" (click)="select(element.Name)" [class.selected-item]="isSelected(element.Name)">
          {{element.DisplayName}}
        </div>
      </div>
    </div>
  </mat-drawer>

</mat-drawer-container>
