<div class="mat-elevation-z8" >
    <div class="conrainer-filter-panel">
      <baseFilterPanel [component]="'app-filterTile'" [selectedProduct]="selectedProductName"
       [dataTile]="dataTile"  [priority]="priority"></baseFilterPanel>
      <app-filterPanel [selectedProduct]="selectedProductName" [typeFilter]="typeFilter" ></app-filterPanel>
    </div>
    <div class="loading-shade" *ngIf="this.isLoadingResults">
      <mat-spinner *ngIf="this.isLoadingResults"></mat-spinner>
    </div>
    <div class="table-container" *ngIf="dataSource.length > 0">
      <div class="table-container-inner" >
          <table  #table mat-table [dataSource]="dataSource"  class="app-standart-table mat-elevation-z8" 
                  matSort (matSortChange)="announceSortChange($event)">
              <ng-container *ngFor="let column of gridcolumns" [matColumnDef]="column.columnDef">
                <th class="grid-header-cell grid-cell" mat-header-cell mat-sort-header [disabled]="!column.isSortable" *matHeaderCellDef >
                  {{column.header}}
                </th>
                <div class="table-body-container">
                  <td mat-cell *matCellDef="let row; let i = index" class="grid-content-cell grid-cell" >  
                    {{ column.cell(row,column,i)}}
                  </td>
                </div>
                <td mat-footer-cell *matFooterCellDef class="grid-footer-cell grid-cell" >  {{ column.cell("row-total",column,10)}} </td>
              </ng-container>
             
               <!-- <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
               <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr> -->
               <tr mat-header-row *matHeaderRowDef="displayedColumns" ></tr>
               <tr mat-row [ngClass]="{ 'table-row-selected': row === selectedRow }" (click)="selectRow(row)" *matRowDef="let row; columns : displayedColumns"></tr>           
               <tr mat-footer-row style="font-weight: 600;" *matFooterRowDef="displayedColumns"> </tr >
              </table>
      </div>
      <mat-paginator [length]="totalRecords" [pageSize]="pageSizeDefault" [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons 
              aria-label="Select page of periodic elements" (page)="handlePage($event)">
      </mat-paginator>
    </div>
  <div *ngIf="dataSource.length == 0">
    <h3> No data</h3>
  </div>
</div>
