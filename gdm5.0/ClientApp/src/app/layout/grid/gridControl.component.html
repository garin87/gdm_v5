<div class="mat-elevation-z8" *ngIf="dataSource.length > 0">
  <div class="loading-shade" *ngIf="isLoadingResults">
    <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
  </div>
  <table  #table mat-table [dataSource]="dataSource"  class="mat-elevation-z8" 
          matSort (matSortChange)="announceSortChange($event)">
    <ng-container *ngFor="let column of gridcolumns" [matColumnDef]="column.columnDef">
      <th mat-header-cell mat-sort-header [disabled]="!column.isSortable"  *matHeaderCellDef>
        {{column.header}}
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
            
        {{ column.cell(row,column,i)}}
      </td>
    </ng-container>
    <!-- <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr> -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns : displayedColumns"></tr>
    
  </table>
  <mat-paginator [length]="totalRecords" [pageSize]="pageSizeDefault" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons 
          aria-label="Select page of periodic elements" (page)="handlePage($event)">
    </mat-paginator>
</div>
